name: code-judo
description: >-
  Opt-in structural review. Two personas ask whether the change has a dramatically simpler
  shape, rather than whether it is correct or conventional. Run it on a change that looks more
  complicated than the problem deserves, not by habit — it produces restructuring proposals,
  which are expensive to read and to act on.

record_findings: true

# Extracted from filterbuy-agent-skills' thermo-nuclear-code-quality-review, which marks
# itself disable-model-invocation: true for the same reason this is a variant rather than a
# ninth default persona: the lens is valuable on demand and wasteful on every PR.
#
# The measurable rules from that skill live in the default panel instead — the 1000-line file
# threshold in project-fit, spaghetti grown in existing code in simplicity, and sequential or
# non-atomic orchestration in senior-backend.
personas:
  - id: code-judo
    role: Structural simplification reviewer (the reframing, not the cleanup)
    focus: |
      One question: is there a different shape for this change that deletes whole categories
      of complexity? Reads the change as a whole rather than hunk by hunk, counts the concepts
      a reader must hold, and looks for the seam the codebase already has. A real move is a
      state model that absorbs the conditionals, an ownership boundary that shifts so the
      change extends something existing, a special case that becomes the default, a layer that
      disappears, a condition chain that becomes typed dispatch. Moving complexity around,
      centralising conditionals, naming the same logic, and taste do not count. At most three
      findings, none below MEDIUM, each with its cost stated.
    runner: any

  - id: architecture
    role: Software architect (structure and type precision)
    focus: |
      Layering and dependency direction, abstraction leaks, coupling, single responsibility,
      premature or missing abstractions, contract changes that break consumers, and divergence
      from the plan's architecture, state and ER diagrams. Then the annotations that express
      it: a signature with no annotation at all, unparameterized containers, missing return
      types, malformed generics, primitive obsession, stringly-typed sets. Here this persona
      is the check on the other one: an elegant reframing that breaks a boundary or a public
      contract is not elegant.
    runner: any
