name: default
description: >-
  Nine-persona review panel. Each persona runs once and records findings by command, so
  the report is a deterministic transform with no aggregator call. Each persona runs once.

# Reviewers append findings with scripts/record.sh instead of printing YAML.
# scripts/report.sh then builds report.md from findings.jsonl.
record_findings: true

# Personas. `runner: any` means the dispatcher assigns based on --ratio.
# Each persona body is the fixed file at personas/<id>.md.
#
# These eight replaced a sixteen-persona panel that ran each persona twice. Every merge below removed a real overlap:
#   senior-backend   absorbed db-performance and error-handling-observability
#   senior-frontend  absorbed design-fidelity
#   correctness      absorbed edge-cases, concurrency-races and test-coverage
#   architecture     absorbed type-precision
#   simplicity       absorbed code-reuse
#   project-fit      absorbed project-patterns, docs-consistency and scope-completeness
# ui-ux is new, not a merge: nothing owned the project's UI conventions, usability,
# component boundaries or motion.
# shortcut-watchdog is new too: every other persona reads the diff as an honest attempt,
# so nothing owned the gap between the work a change claims and the work it contains.
personas:
  - id: security
    role: Security engineer with OWASP Top 10 focus
    focus: |
      authn/authz holes, hardcoded secrets, input validation gaps, SQL/NoSQL injection,
      XSS, CSRF, BOLA/IDOR, rate-limiting absence, dependency CVEs, error message leakage,
      insecure defaults, missing TLS/cert validation, JWT/cookie handling.
    runner: any

  - id: senior-backend
    role: Senior backend engineer (data flow, schema and query performance, observability)
    focus: |
      Handler → service → repo → response tracing: request validation, transaction
      boundaries, idempotency, swallowed errors, timeouts and context propagation,
      responses leaking internals. Schema design: column types, nullability, missing
      foreign-key, unique and check constraints, JSON holding queryable fields, redundant
      or wrongly ordered indexes, more than one migration file where one would do, and
      migrations that lock a large table or cannot be reversed, and migrations that the
      previous release cannot survive while it still runs during the deploy. Query performance: N+1, missing indexes, unbounded results, OFFSET
      pagination, non-sargable predicates, verified with live EXPLAIN (ANALYZE) when a dev
      database is reachable. ORM use: raw SQL where the ORM expresses the same query, rows
      filtered or aggregated in application code, a relation loaded per row, a write loop
      where a bulk call exists. Reads the framework's own query documentation with context7
      before recording an ORM finding. Observability: error context, structured logs with correlation
      ids, metrics and spans on new paths.
    runner: any

  - id: senior-frontend
    role: Senior React/TypeScript engineer (component quality and design fidelity)
    focus: |
      Component design, state location, re-render triggers, list keys, i18n keys, type
      safety, loading/error/empty states, RBAC agreeing with the backend, unsafe HTML
      injection. Accessibility in depth: tab order and Enter/Space operation, a div with an
      onClick and no role, focus indicators and focus moved into and out of dialogs,
      icon-only controls with no accessible name, errors announced through a live region,
      state carried by colour alone, contrast on disabled and placeholder text, alt text.
      Responsiveness against the project's own breakpoints: overflow that scrolls the page
      body, rows that neither wrap nor stack, touch targets, hover-only affordances, images
      capped with max-width. Then the implemented screen
      against the design it followed: layout, hierarchy, states, exact copy, interaction,
      design-system components rebuilt bespoke. A changed screen with no design to check
      against is a HIGH finding.
    runner: any

  - id: ui-ux
    role: UI/UX reviewer (project UI patterns, usability, componentization, motion)
    focus: |
      Records nothing when the diff touches no user-facing UI. Otherwise: an existing
      component or design token rebuilt by hand; a pattern the neighbour screens follow and
      this one does not; usability — an action with no visible outcome, a destructive action
      with no guard, work the user can lose, an undesigned empty/loading/error/permission
      state, labels only the author understands, the primary action buried; componentization
      — several components in one file, reusable fragments left inline, data fetching or
      business rules inside a presentational component when the project puts them in the page,
      layout, hook or service, and the opposite error of splitting too thin; motion and
      feedback — no pending state where the user waits, animation that costs instead of helps,
      bespoke transitions where the project has a utility, prefers-reduced-motion ignored;
      the rendered screen — visual-pass screenshots at desktop and 390 px judged for
      hierarchy, icons and interaction styles. Judges against _shared/ui-quality.md and
      grounds findings with ui-ux-pro-max guidance, but the project's own code outranks it.
    runner: any

  - id: correctness
    role: Correctness reviewer (edge cases, concurrency, test coverage)
    focus: |
      Empty/null/zero inputs, boundary values, unicode, malformed payloads, timeouts,
      partial failures, off-by-one, resource exhaustion. TOCTOU, shared state across
      threads or await contexts, async ordering assumptions, double-fired side effects,
      non-idempotent retries, non-atomic transactions, lost updates, deadlocks. Then
      whether a test proves each of those, whether mocks are current, and whether any
      test asserts nothing meaningful.
    runner: any

  - id: architecture
    role: Software architect (structure and type precision)
    focus: |
      Layering and dependency direction, abstraction leaks, coupling, single
      responsibility, premature or missing abstractions, contract changes that break
      consumers, and divergence from the plan's architecture, state and ER diagrams.
      Then the annotations that express it: a signature with no annotation at all,
      unparameterized containers, missing return types, malformed generics, primitive
      obsession, stringly-typed sets — demanded at contracts, not on private locals. Then
      dependency cycles the diff creates, broken at the ownership mistake and never with a
      deferred import. Then a removal the diff left half-done: the orphan export, test,
      flag, config key, doc and dependency, plus proof that a candidate nothing imports is
      not reached by a route, decorator, registry, signal, template, task name or dynamic
      import. Then the surviving callers of anything the diff removes or renames — searched on
      the latest base branch, with a test mock of a removed path counted as a caller.
    runner: any

  - id: simplicity
    role: Simplicity advocate (over-engineering and reinvention)
    focus: |
      Premature abstraction, speculative generality, dead code, redundant layers,
      over-configurable systems, comments explaining WHAT instead of WHY. Code that does not
      read top down: helpers above the API, mixed abstraction levels, nesting past 2 levels. Then whether
      the codebase already does it: an existing helper reimplemented, a standard-library
      function hand-rolled, a near-copy of a sibling, a new dependency for what an
      installed one covers. Searches with Serena, gitnexus and graphify, never raw grep.
      Declines to force reuse across a real boundary.
    runner: any

  - id: shortcut-watchdog
    role: Shortcut watchdog (work claimed against work done)
    focus: |
      Whether the change makes a check pass without making the code better. Reads the stated
      purpose first, then: assertions that cannot fail, a test that passes either way, a test
      file that only proves existence, the author's paths excluded from a gate, a lowered
      coverage or size threshold, a weakened tool configuration, every suppression comment the
      diff adds, a type escape hatch, a swallowed error, a skipped test, a retry hiding a
      flake. Then deferred work: a marker for work the task assigns, a placeholder body, a
      known defect shipped, a requirement dropped in silence, a Cover-now edge case ID with
      no test. Then the convenient path past a
      documented pattern: a bypassed layer, a missing companion artifact, the unprotected
      variant of a guarded primitive. Owns the gap between claimed and done work, nothing else.
    category: shortcut
    runner: any

  - id: project-fit
    role: Project-fit reviewer (repo rules, documentation, task scope)
    focus: |
      Nearest CLAUDE.md per changed file, .claude/rules/*, .cursor/rules, AGENTS.md, *.rules
      and docs/business-rules, docs/technical-rules and docs/adr that point at the changed
      files; each rule in the plan's Rules section checked against the diff, and a touched rule
      the plan missed; rule→file mapping; naming, layering and
      test-location conventions the surrounding files follow; required companion changes.
      Docs the diff made stale, wrong or incomplete, and new behavior the repo's
      conventions say to document. Project layout and naming: a silenced linter such as
      # noqa or # type: ignore, a shared filename prefix that should be a directory, naming
      that fights the neighbours, a small thing buried in a large file or a file created for
      three lines, a module-level function that is really a method of one class, and a private
      module-level helper that only one class calls. Finally
      dependencies the diff left behind — an installed package nobody imports — and the
      linked task: missing acceptance criteria, scope creep, requirements left unaddressed.
      Quotes the rule or doc line for every rule and doc finding. Layout findings stand on
      the code itself.
    runner: any
