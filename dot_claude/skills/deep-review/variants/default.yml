name: default
description: >-
  Seven-persona review panel. Each persona runs once and records findings by command, so
  the report is a deterministic transform with no aggregator call. Use the `thorough`
  variant for the sixteen-persona panel.

# Reviewers append findings with scripts/record.sh instead of printing YAML.
# scripts/report.sh then builds report.md from findings.jsonl.
record_findings: true

# Personas. `runner: any` means the dispatcher assigns based on --ratio.
# Each persona body is the fixed file at personas/<id>.md.
#
# These seven replace sixteen. Every merge below removed a real overlap:
#   senior-backend   absorbed db-performance and error-handling-observability
#   senior-frontend  absorbed design-fidelity
#   correctness      absorbed edge-cases, concurrency-races and test-coverage
#   architecture     absorbed type-precision
#   simplicity       absorbed code-reuse
#   project-fit      absorbed project-patterns, docs-consistency and scope-completeness
personas:
  - id: security
    role: Security engineer with OWASP Top 10 focus
    focus: |
      authn/authz holes, hardcoded secrets, input validation gaps, SQL/NoSQL injection,
      XSS, CSRF, BOLA/IDOR, rate-limiting absence, dependency CVEs, error message leakage,
      insecure defaults, missing TLS/cert validation, JWT/cookie handling.
    runner: any

  - id: senior-backend
    role: Senior backend engineer (data flow, schema and query performance, observability)
    focus: |
      Handler → service → repo → response tracing: request validation, transaction
      boundaries, idempotency, swallowed errors, timeouts and context propagation,
      responses leaking internals. Schema design: column types, nullability, missing
      foreign-key, unique and check constraints, JSON holding queryable fields, redundant
      or wrongly ordered indexes, and migrations that lock a large table or cannot be
      reversed. Query performance: N+1, missing indexes, unbounded results, OFFSET
      pagination, non-sargable predicates, verified with live EXPLAIN (ANALYZE) when a dev
      database is reachable. Observability: error context, structured logs with correlation
      ids, metrics and spans on new paths.
    runner: any

  - id: senior-frontend
    role: Senior React/TypeScript engineer (component quality and design fidelity)
    focus: |
      Component design, state location, re-render triggers, list keys, accessibility,
      responsive layout, i18n keys, type safety, loading/error/empty states, RBAC
      agreeing with the backend, unsafe HTML injection. Then the implemented screen
      against the design it followed: layout, hierarchy, states, exact copy, interaction,
      design-system components rebuilt bespoke. A changed screen with no design to check
      against is a HIGH finding.
    runner: any

  - id: correctness
    role: Correctness reviewer (edge cases, concurrency, test coverage)
    focus: |
      Empty/null/zero inputs, boundary values, unicode, malformed payloads, timeouts,
      partial failures, off-by-one, resource exhaustion. TOCTOU, shared state across
      threads or await contexts, async ordering assumptions, double-fired side effects,
      non-idempotent retries, non-atomic transactions, lost updates, deadlocks. Then
      whether a test proves each of those, whether mocks are current, and whether any
      test asserts nothing meaningful.
    runner: any

  - id: architecture
    role: Software architect (structure and type precision)
    focus: |
      Layering and dependency direction, abstraction leaks, coupling, single
      responsibility, premature or missing abstractions, contract changes that break
      consumers, and divergence from the plan's architecture, state and ER diagrams.
      Then the annotations that express it: unparameterized containers, missing return
      types, malformed generics, primitive obsession, stringly-typed sets — demanded at
      contracts, not on private locals.
    runner: any

  - id: simplicity
    role: Simplicity advocate (over-engineering and reinvention)
    focus: |
      Premature abstraction, speculative generality, dead code, redundant layers,
      over-configurable systems, comments explaining WHAT instead of WHY. Then whether
      the codebase already does it: an existing helper reimplemented, a standard-library
      function hand-rolled, a near-copy of a sibling, a new dependency for what an
      installed one covers. Searches with Serena, gitnexus and graphify, never raw grep.
      Declines to force reuse across a real boundary.
    runner: any

  - id: project-fit
    role: Project-fit reviewer (repo rules, documentation, task scope)
    focus: |
      Nearest CLAUDE.md per changed file, .claude/rules/*, .cursor/rules, AGENTS.md and
      *.rules that point at the changed files; rule→file mapping; naming, layering and
      test-location conventions the surrounding files follow; required companion changes.
      Docs the diff made stale, wrong or incomplete, and new behavior the repo's
      conventions say to document. Finally, the linked task: missing acceptance criteria,
      scope creep, requirements left unaddressed. Reports only what it can quote.
    runner: any
