 user"],[2,"Output contract & scope"]]},{"id":"s_implement","type":"skill","name":"implement","file":"dot_claude/skills/implement/SKILL.md","description":"Use when invoked via /implement, or when the user asks to build an approved serial plan, PRD or issue set in this session. Builds under strict TDD, commits, then runs the shared after-approval chain (review, QA, PR). For a parallel plan use deep-execute.","outline":[[2,"Input"],[2,"Before the first task"],[2,"Build"],[2,"Test"],[2,"Commit"],[2,"Next"]]},{"id":"s_init_project","type":"skill","name":"init-project","file":"dot_claude/skills/init-project/SKILL.md","description":"Use when invoked via /init-project, or when the user wants to start a project from the AI monorepo template, add an app (react-tanstack, django-ninja, fastapi, go, hono-trpc) to one, or audit a project against it. Audit mode writes only a report.","outline":[[2,"Rules"],[2,"1. Detect the mode"],[2,"2. Resolve the template"],[2,"3. Collect the answers"],[2,"4. New project"],[2,"5. Add an app"],[2,"6. An app without a pack"],[2,"7. The green loop"],[2,"8. Releases"],[2,"9. Observability"],[2,"10. First commit and code index"],[2,"11. GitHub"],[2,"12. Audit"],[2,"13. Final report"]]},{"id":"s_jira_workflow","type":"skill","name":"jira-workflow","file":"dot_claude/skills/jira-workflow/SKILL.md","description":"Use when a message contains a Jira ticket key such as PROJ-123 (even alone) or a pasted Jira URL (atlassian.net/browse/KEY), which means start work on the ticket. Also for start on this, let's pick up. Assigns it to you, moves it In Progress, plans with simple-plan or deep-plan (you confirm), builds, opens the PR, and keeps Jira in step to Done. Not for watching a fixed ticket (use follow-up-jira).","outline":[[2,"0. Mandatory checklist"],[2,"1. Intake"],[3,"1.1 Parse the ticket code"],[3,"1.2 Fetch ticket details"],[3,"1.3 Clarity check — the first hard gate"],[3,"1.4 Name the Orca tab"],[3,"1.5 Ask: main repo or worktree?"],[3,"1.6 Ticket start"],[2,"2. Plan — pick the planner"],[2,"3. Build to PR — the Jira steps"],[2,"4. Watch the PR"],[2,"Tips"]]},{"id":"s_pr_approved","type":"skill","name":"pr-approved","file":"dot_claude/skills/pr-approved/SKILL.md","description":"Use when invoked via /pr-approved, or when the user says a PR is approved and asks to merge and clean up. Resolves every open review thread, waits for green CI, squash-merges, then removes the Orca worktree and the remote branch when no task is left in it.","outline":[[2,"Setup"],[2,"1. threads — no open feedback"],[2,"2. ci — green checks"],[2,"3. merge — squash"],[2,"4. tasks — is work left in this worktree?"],[2,"5. cleanup — remote branch and worktree"],[2,"6. report"]]},{"id":"s_pr_description","type":"skill","name":"pr-description","file":"dot_claude/skills/pr-description/SKILL.md","description":"Use for /ship-it, or when the user asks to write, open or update a pull request, or on handoff from deep-plan, simple-plan or jira-workflow. Writes a Conventional Commit title and a body with ticket, requirements matrix, Mermaid and verification, then opens the PR assigned to the user.","outline":[[2,"Conventions (non-negotiable)"],[2,"Phase 0 — Parse args & sanity checks"],[2,"Phase 0.5 — Spec check and proofs"],[2,"Phase 0.6 — Chain gate (before you write anything)"],[2,"Phase 1 — WRITE (claude Sonnet)"],[2,"Phase 2 — REVIEW (codex)"],[2,"Phase 2.5 — EVIDENCE (UI changes)"],[2,"Phase 2.6 — PERMISSIONS (access changes)"],[2,"Phase 2.7 — BLINDSPOT (every PR)"],[2,"Phase 3 — OPEN / UPDATE PR"],[2,"Phase 4 — Report"],[2,"Phase 5 — Watch and address feedback (default; skip with --no-watch)"],[2,"Checklist (orchestrator ticks after Phase 3)"],[2,"Reuse"],[2,"Failure modes"]]},{"id":"s_qa_test_plan","type":"skill","name":"qa-test-plan","file":"dot_claude/skills/qa-test-plan/SKILL.md","description":"Use via /qa-plan before implementation (write the QA test plan), /qa-execute after review on a frozen commit (run the plan, produce QA evidence for the PR), or /qa-test-plan for both. Produces qa-plan.yaml, videos, screenshots and an HTML report.","outline":[[2,"Arguments"],[2,"Contract files"],[2,"Phase 0: resolve paths"],[2,"Phase 1: map QA plan"],[2,"Phase 2: freeze execution target"],[2,"Phase 3: execute with agent-browser"],[2,"Phase 4: validate and render"],[2,"Phase 5: report"],[2,"Completion gates"]]},{"id":"s_release","type":"skill","name":"release","file":"dot_claude/skills/release/SKILL.md","description":"Use when the user asks to cut, ship, tag or bump a release, merge a release-please Release PR, or asks what the next version would ship. Tags and creates the GitHub release only after the user confirms. Never force-pushes. For the announcement text use release-announce.","outline":[[2,"Never"],[2,"1. Check the environment"],[2,"2. Detect the mechanism"],[2,"3. Review what ships"],[2,"4. Compute the next version"],[2,"5. Run the checks"],[2,"6. Ask for confirmation"],[2,"7. Release"],[2,"8. Hand off"]]},{"id":"s_release_announce","type":"skill","name":"release-announce","file":"dot_claude/skills/release-announce/SKILL.md","description":"Use when the user asks for release notes, a changelog, an announcement for a version that already shipped, per-ticket comments for reporters, or types /release-announce. Drafts only, never posts. To cut or tag the release use release.","outline":[[2,"Voice"],[2,"Steps"],[2,"Never"]]},{"id":"s_shed_light","type":"skill","name":"shed-light","file":"dot_claude/skills/shed-light/SKILL.md","description":"Use when someone must decide whether an implementation is worth its upkeep, such as a plan that adds infrastructure, a PR that grew machinery, or a question about over-engineering or maintenance burden. Lists what the team must own, ranked by complexity.","outline":[[2,"Write it for the decision"],[2,"1. Set the scope"],[2,"2. Inventory the additions"],[2,"3. Rate the complexity, estimate the upkeep separately"],[2,"4. Trace the work that leaves the team"],[2,"5. Output"],[2,"Scope"]]},{"id":"s_simple_plan","type":"skill","name":"simple-plan","file":"dot_claude/skills/simple-plan/SKILL.md","description":"Use when invoked via /simple-plan, or for a small or medium change (one module, no new contract) that needs a short reviewed plan with the least code. Builds and opens the PR after approval. For large or risky work use deep-plan.","outline":[[2,"Setup"],[2,"Phase 0 — Project context brief"],[2,"Phase 0.5 — Recommend the pipeline, and wait for the answer"],[2,"Phase 1 — Grill the plan"],[2,"Phase 1.2 — Brainstorm, only when the design is still open"],[2,"Phase 1.5 — Split the work, when it is more than one task"],[2,"Phase 2 — Draft the plan"],[3,"UI/UX consultation, when the change touches an interface"],[3,"Required sections"],[2,"Phase 3 — Review"],[2,"Phase 3.5 — Blindspot pass"],[2,"Phase 4 — Present the plan"],[2,"Phase 5 — Build to PR, without waiting"],[2,"Failure handling"]]},{"id":"s_simplify","type":"skill","name":"simplify","file":"dot_claude/skills/simplify/SKILL.md","description":"Use when invoked via /simplify, or when the user asks to tidy code just written (dead code, nesting, duplicates, unclear names) without restructuring. For architecture or codebase-wide smells use /refactor.","outline":[[2,"What This Does"],[2,"What This Does NOT Do"],[2,"Process"],[2,"Simplification Patterns"],[3,"Guard Clauses"],[3,"Early Returns"],[3,"Flatten Nesting"],[2,"Commands to Execute"],[2,"Output Format"],[2,"When to Use"]]},{"id":"s_ub_mode","type":"skill","name":"ub-mode","file":"dot_claude/skills/ub-mode/SKILL.md","description":"Follow the reduced principles when writing or changing code. Every change follows First Make it Work, then Then Make it Right, then Follow Practice. Use when the user runs /ub-mode or asks for the reduced principles, and when a planning, build or review skill says to apply ub-mode.","outline":[[2,"Laziness Protocol"],[2,"Foundational Thinking"],[2,"TDD"],[2,"Redesign From First Principles"],[2,"Attack the Premise"],[2,"Subtract Before You Add"],[2,"Outcome-Oriented Execution"],[2,"Build the Lever"],[2,"Architecture"],[3,"Model the Domain"],[3,"Boundary Discipline"],[3,"Type System Discipline"],[3,"Make Operations Idempotent"],[3,"Separate Before Serializing Shared State"],[2,"Fix Root Causes"],[2,"Sequence work into verifiable units"],[2,"Test Behavior, Not Implementation"],[2,"Crapper"],[2,"Dryer"],[2,"Mutator"],[2,"Refactoring"],[2,"Keep a Log"],[2,"Guard the Context Window"],[2,"Worktree Cleanup"],[2,"Commit and Push"],[2,"Tools"],[3,"Where the gates run"],[2,"Precedence"]]},{"id":"s_video_demo","type":"skill","name":"video-demo","file":"dot_claude/skills/video-demo/SKILL.md","description":"Use when the user asks for a narrated demo or walkthrough video of a feature for a stakeholder or customer. Records the real flow with word-synced captions and edge-tts voices (English, pt-BR). For stills use annotated-screenshots.","outline":[[2,"Rules for the video"],[2,"Pipeline"],[3,"1. Copy the template and render the example"],[3,"2. Plan the flows"],[3,"3. Record one clip per step"],[3,"4. Write narration.json"],[3,"5. Voice"],[3,"6. Preview, render and verify"],[2,"Dependencies"],[2,"Deliverables"]]},{"id":"s_workflow_finish","type":"skill","name":"workflow-finish","file":"dot_claude/skills/workflow-finish/SKILL.md","description":"Use before /ship-it in a repository with `.workflow/config.json`, after a fast task is built and tested or after workflow-post-implementation. Writes the checks into `workflow.md` (fast) or `finish.md` (standard). Last stage, before the PR.","outline":[[2,"1. Check the repository"],[2,"2a. Fast mode — complete workflow.md"],[2,"2b. Standard mode — write finish.md"],[2,"3. Verify"]]},{"id":"s_workflow_mode","type":"skill","name":"workflow-mode","file":"dot_claude/skills/workflow-mode/SKILL.md","description":"Use before the first code of a task in a repository with `.workflow/config.json`, or when asked which mode a task needs. Recommends fast or standard, lets the user confirm, and writes `workflow.md`. Stage 1, before workflow-post-plan, workflow-post-implementation and workflow-finish.","outline":[[2,"1. Check the repository"],[2,"2. Recommend a mode"],[2,"3. Ask the user"],[2,"4. Write workflow.md"],[2,"Next"]]},{"id":"s_workflow_post_implementation","type":"skill","name":"workflow-post-implementation","file":"dot_claude/skills/workflow-post-implementation/SKILL.md","description":"Use after the build, with review and QA results in hand, in a standard-mode task of a repository with `.workflow/config.json`. Writes `post-implementation.md` and loops on the verifier. Stage 3, after the code exists and before workflow-finish.","outline":[[2,"1. Check the repository"],[2,"2. Collect the evidence"],[2,"3. Write the artifact"],[2,"4. Verify"],[2,"Next"]]},{"id":"s_workflow_post_plan","type":"skill","name":"workflow-post-plan","file":"dot_claude/skills/workflow-post-plan/SKILL.md","description":"Use right after the user approves a plan in a standard-mode task of a repository with `.workflow/config.json`. Writes `post-plan.md` and `decisions.md` and loops on the verifier. Stage 2, before any code is built.","outline":[[2,"1. Check the repository"],[2,"2. Copy the plan"],[2,"3. Review the plan"],[2,"4. Write the artifacts"],[2,"5. Verify"],[2,"Next"]]},{"id":"a_architecture_critic","type":"agent","name":"architecture-critic","file":"dot_claude/agents/architecture-critic.md","description":"Reviews proposed target architectures and transformed code against modern best practice. Adversarial — looks for over-engineering, missed requirements, and simpler alternatives.","outline":[[2,"Review lens"],[2,"Secret handling (mandatory)"],[2,"Output"],[2,"Untrusted content discipline"]]},{"id":"a_fixer","type":"agent","name":"fixer","file":"dot_claude/agents/fixer.md","description":"Fixes the findings of a code review or the failures of a QA run, one finding at a time, with a regression test for each. Never reviews its own fix and never commits.  Use when the build chain sends review findings or QA failures to a separate agent.","outline":[[2,"Input"],[2,"Step file"],[2,"Rules"],[2,"Done"],[2,"Output"]]},{"id":"a_implementer_backend","type":"agent","name":"implementer-backend","file":"dot_claude/agents/implementer-backend.md","description":"Builds one backend task of an approved plan under strict TDD: server code, APIs, models, migrations, jobs and their tests. Edits only the files that the task names. Never commits.  Use when the build chain starts the implementer of a backend task.","outline":[[2,"Input"],[2,"Step file"],[2,"Rules"],[2,"Done"],[2,"Output"]]},{"id":"a_implementer_frontend","type":"agent","name":"implementer-frontend","file":"dot_claude/agents/implementer-frontend.md","description":"Builds one frontend task of an approved plan under strict TDD: screens, components, state and their tests, with every UI state and a visual pass. Edits only the files that the task names. Never commits.  Use when the build chain starts the implementer of a UI task.","outline":[[2,"Input"],[2,"Step file"],[2,"Rules"],[2,"Done"],[2,"Output"]]},{"id":"a_plan_reviewer","type":"agent","name":"plan-reviewer","file":"dot_claude/agents/plan-reviewer.md","description":"Reviews an implementation plan before any code exists, through one lens: backend or frontend. Checks scope drift against the task, the plan format, the types, the project patterns, clean and reusable code, the callers and flows the plan missed, external systems, the architecture and the edge cases. Writes a verdict file. Never edits the plan or the code.  Use when simple-plan reaches its review phase: one agent per side that the plan changes.","outline":[[2,"Input"],[2,"Steps"],[2,"Checklist"],[2,"Output"]]},{"id":"a_qa_business","type":"agent","name":"qa-business","file":"dot_claude/agents/qa-business.md","description":"End-to-end QA of business rules. Runs each ticket requirement, rule and edge case through the real app, checks every side effect in every system it can reach, and records a video of each flow. Ends with a GO or NO-GO verdict tied to the tested commit. Never edits code.  Use after the build and review of a plan, when the environment answers, or when the user asks to test the business rules or the flows of a change end to end.","outline":[[2,"Input"],[2,"Step file"],[2,"1. Pre-flight"],[2,"2. Build the scenarios"],[2,"3. Run the scenarios"],[2,"4. Classify the findings"],[2,"Output"],[2,"Rules"]]},{"id":"a_qa_ui","type":"agent","name":"qa-ui","file":"dot_claude/agents/qa-ui.md","description":"Visual QA for a UI change. Screenshots each new or changed element at desktop width and at 390 px, and compares it with the plan's UI design pass and, when one exists, the Design canvas artboard. Reports one row per difference. Never edits code.  Use after the build of a plan that has a UI design pass, or when the user asks to check that an implementation matches its design, mockup or artboard.","outline":[[2,"Input"],[2,"Step file"],[2,"Steps"],[2,"Output"],[2,"Rules"]]},{"id":"a_security_auditor","type":"agent","name":"security-auditor","file":"dot_claude/agents/security-auditor.md","description":"Adversarial security reviewer — OWASP Top 10, CWE, dependency CVEs, secrets, injection. Use for security debt scanning and pre-modernization hardening.","outline":[[2,"Coverage checklist"],[2,"Tooling"],[2,"Secret handling (mandatory)"],[2,"Reporting standard"],[2,"Untrusted content discipline"]]},{"id":"a_ui_designer","type":"agent","name":"ui-designer","file":"dot_claude/agents/ui-designer.md","description":"Turns the UI need of a ticket or plan into a Design canvas on claude.ai, built on the project's own design system. Maps the components, palette, fonts, spacing and UI rules from the codebase, reads and screenshots the screens it will change, finds or creates the project's Design System artifact, then draws one artboard per screen and state. Stays open so the user can iterate on the canvas. Never edits code.  Use when a plan's UI design pass applies, or when the user asks for a mockup, an artboard or a canvas of a screen before it is built.","outline":[[2,"Input"],[2,"1. Map the design system from the code"],[2,"2. Look at the current screens"],[2,"3. Find or create the project's design system"],[2,"4. Draw the canvas"],[2,"5. Export the artboards as images"],[2,"6. Hand over"],[2,"Rules"]]},{"id":"d_after_approval","type":"shared","name":"after-approval.md","file":"dot_claude/skills/_shared/after-approval.md","description":"","outline":[[2,"0. Hold the chain open"],[2,"Parallel agents run in Orca"],[2,"1. Build"],[2,"2. Review"],[2,"3. Is the environment ready?"],[2,"4. UI parity — the qa-ui agent"],[2,"5. Business rules and end to end — the qa-business agent"],[2,"6. Fix and re-test"],[2,"7. Demo, report and PR"],[2,"8. Deliver the report"]]},{"id":"d_external_services","type":"shared","name":"external-services.md","file":"dot_claude/skills/_shared/external-services.md","description":"","outline":[[2,"The two shapes"],[2,"Rules for both shapes"],[2,"In a plan"],[2,"In a review"]]},{"id":"d_implementer_rules","type":"shared","name":"implementer-rules.md","file":"dot_claude/skills/_shared/implementer-rules.md","description":"","outline":[[2,"Precedence"],[2,"Core"],[3,"Before you write"],[3,"Scope and design"],[3,"Types and input"],[3,"State, concurrency and failure"],[3,"Security"],[3,"Placement"],[3,"Structure"],[3,"Tests"],[3,"Before you report done"],[2,"Backend"],[2,"UI"],[2,"When in doubt"]]},{"id":"d_inbox","type":"shared","name":"inbox.md","file":"dot_claude/skills/_shared/inbox.md","description":"","outline":[[2,"Is it available?"],[2,"Use the Inbox for"],[2,"Do not use the Inbox for"],[2,"Decisions during a build chain"],[2,"Replies"],[2,"Content"]]},{"id":"d_orca_workers","type":"shared","name":"orca-workers.md","file":"dot_claude/skills/_shared/orca-workers.md","description":"","outline":[[2,"1. Choose the mode"],[2,"1.5 Choose the agent"],[
