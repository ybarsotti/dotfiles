#:schema /Users/barsotti/Developer/Pers/prompt-router/src/prompt_router/config.schema.json
# Only the keys that differ from the defaults. See config.example.toml in the clone.

mode = "hint"

# The default patterns, plus short Portuguese replies and Orca worker messages.
skip_patterns = [
  '^\s*[/$!#<]',
  '(?i)^\s*(y|yes|no|ok|okay|go|continue|sim|nao|não|pode|beleza|boa|[a-d1-9])\W*$',
  '(?i)^(coordinator|## reply from|# lane|you are (a|the) .*worker|\[from )',
]

# A prompt that starts with a ticket key or has a ticket URL goes to jira-workflow, with no embedding or judge call.
[[rules]]
pattern = '^\s*[A-Z][A-Z0-9]+-\d+\b|atlassian\.net/browse/'
target = "jira-workflow"

[catalog]
exclude = ["source-command-*"]   # leftovers of an old Codex command migration

[judge]
env_unset = ["CLAUDE_CODE_OAUTH_TOKEN"]   # a stale token in the shell env breaks the judge child

# Orca starts workers through these commands. The pretool hook reads the task from them.
[[pretool.wrappers]]
command = "orca terminal create"
nested = "--command"

[[pretool.wrappers]]
command = "orca orchestration worker-start"
task_file = "--spec-file"
agent = "--agent"
