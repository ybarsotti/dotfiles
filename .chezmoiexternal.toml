    checksum.sha256 = "a8d4df69175f8a476fc79e345d1a972b28c34b04f4177dfc6e425901fa458475"

# Obscura — a local headless browser for agents, written in Rust, with no Chrome and no Node.
# Homebrew has no formula for it, so this pins a release archive and its SHA256. Bump the
# version and the checksum together; a retag upstream then cannot change what lands here.
# The archive holds two binaries: `obscura`, and the `obscura-worker` that `serve` and
# `scrape` spawn beside it. Only `obscura` is symlinked into ~/.local/bin, because it
# resolves its own real path and finds the worker there.
[".local/share/obscura"]
    type = "archive"
    exact = true
{{- if eq .chezmoi.arch "arm64" }}
    url = "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.0/obscura-aarch64-macos.tar.gz"
    checksum.sha256 = "ccb0ee8a6905947d610beb1d7a250f7e6f8b9a75b1419fc59a9f3b607fabf54e"
{{- else }}
    url = "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.0/obscura-x86_64-macos.tar.gz"
    checksum.sha256 = "72613618071c6bb75b4dbecfb79844232bcc5eeef2b53d7e3f424cb3ad42b345"
{{- end }}
{{ end }}
